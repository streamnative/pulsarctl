name: Pulsarctl
on:
  pull_request:
    branches:
      - '*'
    path-ignores:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
jobs:
  ut-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Login SN docker hub
      if: github.event.pull_request.user.login == 'streamnativebot'
      run: docker login -u="${{ secrets.DOCKER_USER }}" -p="${{ secrets.DOCKER_PASSWORD}}"
    - uses: actions/checkout@v2
    - name: Run tests
      run: scripts/run-integration-tests.sh
      env:
        PULSAR_IMAGE: ${{ github.event.pull_request.user.login == 'streamnativebot' && 'snstage/pulsar-all' || 'apachepulsar/pulsar-all' }}
