name: Pulsarctl
on:
  pull_request:
    branches:
      - '*'
    path-ignores:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
jobs:
  style-check:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go 1.26.9
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.9
        id: go
      - name: Check out code into the Go module directory
        uses: actions/checkout@v2
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.7.2 run --timeout=10m -v
      - name: Build
        run: go build .
